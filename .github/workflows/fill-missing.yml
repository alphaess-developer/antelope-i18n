name: Fill missing languages

# ⚠️ 2026-08-06：文档约定 PR 应直接带 11 语种真译文；「只交英文占位当终态」已停用。
# 本 workflow 仍会在缺 key 时用 en-US 占位补齐，作为 CI 兜底（key 对齐检查是阻塞级）。
# 合入前应尽量换成真译文，不要依赖占位作为终态。见 docs/decisions.md D8。
#
# 占位不带状态标记 —— 原先写 _meta/ draft 的机制已移除，见 docs/decisions.md D15。

on:
  pull_request:
    branches: [main]
    paths:
      - 'locales/**'

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    # fork 来的 PR 无法 push 回分支，跳过（内部仓库正常不用 fork）
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fill missing keys with base language
        run: |
          node tools/fill-missing.mjs --write
          node tools/sort-keys.mjs --write

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "无需补齐"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(i18n): 用基准语言占位补齐缺失语种" \
                     -m "由 fill-missing workflow 自动生成（CI 兜底）。请尽快换成真译文后再合入。"
          git push
